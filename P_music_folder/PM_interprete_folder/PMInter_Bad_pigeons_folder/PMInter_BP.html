    <!-- ------------------------------------------------------------------
         1️⃣  Initialisation de la page « Interprète »
         ------------------------------------------------------------------ -->
    <script>
        function initHouriaaPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const domainUrl = urlParams.get('domain');
            const langUrl   = urlParams.get('lang');

            // Langue
            if (langUrl && (langUrl === 'fr' || langUrl === 'en')) {
                currentLang = langUrl;
                localStorage.setItem('preferredLang', currentLang);
            } else {
                currentLang = localStorage.getItem('preferredLang') || 'fr';
            }
            document.documentElement.lang = currentLang;

            // Domaine (aero / music)
            if (domainUrl && (domainUrl === 'aero' || domainUrl === 'music')) {
                currentDomain = domainUrl;
                localStorage.setItem('preferredDomain', currentDomain);
            } else {
                currentDomain = localStorage.getItem('preferredDomain') || 'music';
            }

            // Thème musique
            document.body.classList.remove('theme-aero');
            document.body.classList.add('theme-music');

            // Header dynamique
            loadHeader();

            // Traductions de la page
            translatePage(currentLang);

            // Mise à jour des liens internes
            updateExternalLinks();
        }

        document.addEventListener('DOMContentLoaded', initHouriaaPage);
    </script>
