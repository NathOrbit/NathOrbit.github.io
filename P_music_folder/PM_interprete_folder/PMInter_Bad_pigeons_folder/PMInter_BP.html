                </a>

        <section class="events-list">
            <h2 data-i18n="music_events_title">Évènements</h2>

            <!-- ==== 1️⃣ Sélecteur TYPE d’événement ==== -->
            <div class="visibility-filter" id="visibility-filter-music">

                <button class="filter-btn active" data-i18n="events_filter_all" data-filter="all">Tous</button>

                <button class="filter-btn"        data-filter="tech">Tech</button>

            <!-- ==== 2️⃣ Sélecteur ARTISTE ==== -->

                <button class="filter-btn" data-i18n="events_filter_all" data-filter="all">Tous</button>
                <button class="filter-btn active"        data-filter="houriaa">Houriaa</button>
                <button class="filter-btn"        data-filter="badpigeons">Bad Pigeons</button>

            <h3 class="sub-title" data-i18n="events_title_a_venir" id="upcoming-title-music">À venir</h3>
            <div id="cards-container-music-upcoming" class="cards-subcontainer"></div>

            <h3 class="sub-title" data-i18n="events_title_passe" id="past-title-music">Passés</h3>
            <div id="cards-container-music-past" class="cards-subcontainer"></div>
        </section>















    </main>

    <!-- Footer dynamique -->
    <div id="dynamic-footer"></div>
    <script>
    // S’attendre à ce que le DOM soit chargé
    document.addEventListener('DOMContentLoaded', () => {
        // 1️⃣  Le conteneur des filtres d'artistes
        const artistFilter = document.getElementById('artist-filter-music');
        if (!artistFilter) return;   // sécurité

        // 2️⃣  Désactiver tous les boutons du groupe
        artistFilter.querySelectorAll('.filter-btn')
                    .forEach(btn => btn.classList.remove('active'));

        // 3️⃣  Sélectionner le bouton « houriaa »
        const houriaaBtn = artistFilter.querySelector('.filter-btn[data-filter="badpigeons"]');
        if (!houriaaBtn) return;

        // 4️⃣  L’activer visuellement
        houriaaBtn.classList.add('active');

        // 5️⃣  (Optionnel) Simuler le clic pour que le filtre s’applique immédiatement
        houriaaBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    });
    </script>
    <script src="/Event_list.js"></script>
    <!-- ------------------------------------------------------------------
         1️⃣  Initialisation de la page « Interprète »
         ------------------------------------------------------------------ -->
    <script>
        function initHouriaaPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const domainUrl = urlParams.get('domain');
            const langUrl   = urlParams.get('lang');

            // Langue
            if (langUrl && (langUrl === 'fr' || langUrl === 'en')) {
                currentLang = langUrl;
                localStorage.setItem('preferredLang', currentLang);
            } else {
                currentLang = localStorage.getItem('preferredLang') || 'fr';
            }
            document.documentElement.lang = currentLang;

            // Domaine (aero / music)
            if (domainUrl && (domainUrl === 'aero' || domainUrl === 'music')) {
                currentDomain = domainUrl;
                localStorage.setItem('preferredDomain', currentDomain);
            } else {
                currentDomain = localStorage.getItem('preferredDomain') || 'music';
            }

            // Thème musique
            document.body.classList.remove('theme-aero');
            document.body.classList.add('theme-music');

            // Header dynamique
            loadHeader();

            // Traductions de la page
            translatePage(currentLang);

            // Mise à jour des liens internes
            updateExternalLinks();
        }

        document.addEventListener('DOMContentLoaded', initHouriaaPage);
    </script>

            translations.fr.gallery_title =

    <!-- ------------------------------------------------------------------
         3️⃣  Chargement du footer (chemin absolu)
         ------------------------------------------------------------------ -->
    <script>
        fetch('/footer.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('dynamic-footer').innerHTML = html;
                translatePage(currentLang);
                updateExternalLinks();
            })
            .catch(err => console.error('Erreur chargement footer :', err));
    </script>
