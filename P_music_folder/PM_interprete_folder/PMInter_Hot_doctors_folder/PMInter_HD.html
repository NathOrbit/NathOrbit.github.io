    <!-- Footer dynamique -->
    <div id="dynamic-footer"></div>

    <!-- ------------------------------------------------------------------
         1️⃣  Initialisation de la page « Interprète »
         ------------------------------------------------------------------ -->
    <script>
        function initHouriaaPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const domainUrl = urlParams.get('domain');
            const langUrl   = urlParams.get('lang');

            // Langue
            if (langUrl && (langUrl === 'fr' || langUrl === 'en')) {
                currentLang = langUrl;
                localStorage.setItem('preferredLang', currentLang);
            } else {
                currentLang = localStorage.getItem('preferredLang') || 'fr';
            }
            document.documentElement.lang = currentLang;

            // Domaine (aero / music)
            if (domainUrl && (domainUrl === 'aero' || domainUrl === 'music')) {
                currentDomain = domainUrl;
                localStorage.setItem('preferredDomain', currentDomain);
            } else {
                currentDomain = localStorage.getItem('preferredDomain') || 'music';
            }

            // Thème musique
            document.body.classList.remove('theme-aero');
            document.body.classList.add('theme-music');

            // Header dynamique
            loadHeader();

            // Traductions de la page
            translatePage(currentLang);

            // Mise à jour des liens internes
            updateExternalLinks();
        }

        document.addEventListener('DOMContentLoaded', initHouriaaPage);
    </script>

    <!-- ------------------------------------------------------------------
         2️⃣  Traductions (FR / EN) – clés uniques
         ------------------------------------------------------------------ -->
    <script>
        if (!translations.fr.interp_page_title) {
            /* --------------------- FR --------------------- */

            translations.fr.group_description =
                "Ancien guitariste du groupe Hot Doctors, aujourd'hui sous le nom de Hot Doctors Revival, un groupe tourangeau porté par mon père. Après plusieurs années passées à interpréter des standards du rock, de blues et des arrangements sur les scènes de la région Centre Val de Loire, mes aventures professionnelles m'ont amené quitter le groupe. Le groupe poursuit ses aventures dans la région et ses alentours. ";


            /* -------------------------------------------------
            EN – English
            ------------------------------------------------- */
            translations.en.group_description =
                "Former guitarist of the band Hot Doctors, now known as Hot Doctors Revival, a Touraine‑based group driven by my father. After several years performing rock standards, blues classics, and various arrangements on stages throughout the Centre‑Val de Loire region, my professional path led me to leave the band. The group continues its adventures in the region and its surroundings.";

            translations.fr.interp_page_title   = "Hot Doctors";
            translations.fr.group_title = "Présentation du groupe";


            translations.fr.gallery_title = "Galerie photos";

            translations.fr.documents_title =
            "Documents professionnels";


            /* --------------------- EN --------------------- */

            translations.en.interp_page_title = "Hot Doctors";

            translations.en.group_title = "Band presentation";


            translations.en.gallery_title =
            "Photo gallery";

            translations.en.documents_title =
            "Professional documents";
        }
    </script>

    <!-- ------------------------------------------------------------------
         3️⃣  Chargement du footer (chemin absolu)
         ------------------------------------------------------------------ -->
    <script>
        fetch('/footer.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('dynamic-footer').innerHTML = html;
                translatePage(currentLang);
                updateExternalLinks();
            })
            .catch(err => console.error('Erreur chargement footer :', err));
    </script>
