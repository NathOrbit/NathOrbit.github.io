    <!-- ---------------------------------------------------------
         1️⃣  Initialisation de la page « Interprète »
         --------------------------------------------------------- -->
    <script>
        function initInterpPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const domainUrl = urlParams.get('domain');
            const langUrl   = urlParams.get('lang');

            // Langue
            if (langUrl && (langUrl === 'fr' || langUrl === 'en')) {
                currentLang = langUrl;
                localStorage.setItem('preferredLang', currentLang);
            } else {
                currentLang = localStorage.getItem('preferredLang') || 'fr';
            }
            document.documentElement.lang = currentLang;

            // Domaine (aero / music)
            if (domainUrl && (domainUrl === 'aero' || domainUrl === 'music')) {
                currentDomain = domainUrl;
                localStorage.setItem('preferredDomain', currentDomain);
            } else {
                currentDomain = localStorage.getItem('preferredDomain') || 'music';
            }

            // Thème musique
            document.body.classList.remove('theme-aero');
            document.body.classList.add('theme-music');

            // Header dynamique
            loadHeader();

            // Traductions de la page
            translatePage(currentLang);

            // Mise à jour des liens internes
            updateExternalLinks();
        }

        document.addEventListener('DOMContentLoaded', initInterpPage);
    </script>

    <!-- ---------------------------------------------------------
         2️⃣  Traductions (FR / EN) – clés uniques
         --------------------------------------------------------- -->
    <script>
        /* -------------------------------------------------
           FR – toutes les clés
           ------------------------------------------------- */
        if (!translations.fr.interp_page_title) {

            translations.fr.interp_page_title     = "ECSSMET 2024";
            translations.fr.production_hero_title = "European Conference on Spacecraft Structures, Materials and Environmental Testing";
            translations.fr.production_hero_tagline = "ESA‑ESTEC, Noordwijk, Pays‑Bas, 2024";
            translations.fr.documents_title       = "Abstract";
            translations.fr.overview_intro = "Prédire les niveaux de chocs mécaniques avant les essais et le vol est un objectif important lors de la conception des systèmes spatiaux. Les méthodes de modélisation actuelles ne sont pas encore sufisamment robustes dans le secteur spatial, ce qui nécessite l’étude et la comparaison de différentes approches. La première contribution est la comparaison de deux méthodes : FEM explicite et FEM/TSEA hybride. La première est bien connue mais pas suffisamment efficace pour étudier les tests de choc sur des systèmes spatiaux complexes, tandis que la seconde a connu des améliorations significatives ces dernières années, mais sans usage défini pour les chocs dans le secteur spatial. Au final, le FEM explicite semble efficace et précis pour les systèmes simples, alors que le FEM/TSEA hybride montre un meilleur potentiel dans les systèmes complexes comme les satellites. La seconde contribution de l’article montre que la dépence des données d'injection liées à la caractérisation de la source de choc dans les résultats de la méthode hybride FEM/TSEA. Ainsi, la normalisation de la répartition d’énergie par rapport à la base modale du système de caractérisation est indispensable avant de l’injecter dans le système étudié.";
            translations.fr.overview_conclusion = "Dans cette étude, on montre au travers du code de calcul FEM/TSEA que méthodes sont prometteuse pour améliorer la prédiction des niveaux de chocs pour les engins spatiaux, vis à vis des résultats obtenus. En particulier, la distribution d’énergie en fréquence normalisée semble être une méthode pratique et précise pour représenter les sources de choc. Ces conclusions doivent maintenant être confirmées par davantage d’études de cas sur des modèles d’engins spatiaux plus complexes. La précision ainsi que l'adaptatbilité de la méthode pour le dimensionnement des structures doit aussi être étudié car il sera necessaire en dimensionnement de réaliser des calculs de contraintes et de charges."
            translations.fr.overview_add_on   = "Ces travaux nous ont ensuite amenés à étudier l'approche NERS, que j'invite à lire.";
            translations.fr.pub_section_title    = "Publications et Communications";
            translations.fr.doc_extended_abstract = "🗎 Abstract étendu";
            translations.fr.doc_site_ecssmet      = "🌐 Site ECSSMET 2024";

            /* -------------------------------------------------
               EN – all keys, single definition
               ------------------------------------------------- */

            translations.en.interp_page_title     = "ECSSMET 2024";
            translations.en.production_hero_title = "European Conference on Spacecraft Structures, Materials and Environmental Testing";
            translations.en.production_hero_tagline = "ESA‑ESTEC, Noordwijk, Netherlands, 2024";
            translations.en.documents_title       = "Abstract";
            translations.en.overview_intro        = "Predicting mechanical shock levels before testing and flying is an important objective for space systems. Current modelling methods are not well‑established in the space sector, necessitating the study and comparison of different approaches. The first contribution is the comparison of two methods: explicit FEM and hybrid FEM/TSEA. The former is well‑known but not sufficiently effective for studying shock tests on complex space systems, while the latter is getting significant improvements in recent years, but without defined usage for shocks in the space sector. Ultimately, explicit FEM appears efficient and precise for simple systems, whereas hybrid FEM/TSEA shows better potential in complex systems like satellites. The second contribution of the article shows the shock source characterization system's dependence on injection data and results from the hybrid FEM/TSEA method. Thus, normalization of the energy distribution relative to the characterization system's modal basis is required before injecting it into the studied system.";
            translations.en.overview_conclusion   = "In this study, with the FEM/TSEA computational code and the results obtained, methods employed showed promising for improving shock levels predictions for spacecrafts. Especially, normalized frequency energy distribution seems to be a convenient and accurate method for representing shock sources. These conclusions now need to be confirmed with more case studies on more complex spacecraft models. The accuracy and convenience of the method for structure sizing – stresses and loads computations, should be also evaluated.";
            translations.en.overview_add_on   = "These studies subsequently led us to explore the NERS approach, which I encourage you to read.";
            translations.en.pub_section_title    = "Publications and Communications";
            translations.en.doc_extended_abstract = "🗎 Extended abstract";
            translations.en.doc_site_ecssmet      = "🌐 ECSSMET 2024 Website";

        }
    </script>
