<header id="site-header">
    <!-- 2. CENTRE : Titre -->
    

    <div class="brand-title">
            <h1>
                <a href="/index.html" class="logo-link" aria-label="Retour à l’accueil">
                    NathOrbit
                </a>
            </h1>
            <!-- *** séparateur visible uniquement < 600 px *** -->
            <hr class="head_divider">
    </div>

    <!-- Conteneur qui regroupe les deux colonnes de contrôles -->
    <div class="controls-wrapper">
        
        <!-- 1. GAUCHE : Domaines -->
        <div class="control-group left-controls">
            <button id="btn-aero" data-i18n="head_button_aero" class="active"
                    onclick="handleDomainClick('aero')">Aérospatial</button>
            <button id="btn-music" data-i18n="head_button_music"
                    onclick="handleDomainClick('music')">Musique</button>
        </div> 

        <!-- 3. DROITE : Langues -->
        <div class="control-group right-controls">
            <button id="btn-fr" class="active" onclick="switchLang('fr')">FR</button>
            <button id="btn-en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>
